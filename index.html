<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/x-icon"

      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/23021fc8d3.js" crossorigin="anonymous" defer></script>
  </head>
  <body>
    <div class="to-do-app">
      <h2>To-Do List</h2>
      <div class="input-section">
        <input type="text" id="task-input" placeholder="Enter a new task..." />
        <button type="button" id="add-task-btn"><i class="fa-solid fa-plus"></i>Add Task</button>
      </div>
      <div class="tasks-section">
        <ul class="task-list">
          
          <!-- Tasks will be listed here -->
        </ul>
        <div class="all-caught-up">
          <i class="fa-regular fa-circle-check"></i>
          <p>All Caught Up!</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
